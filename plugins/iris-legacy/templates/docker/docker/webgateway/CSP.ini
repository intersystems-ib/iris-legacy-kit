[SYSTEM]
SM_TIMEOUT=300
SM_Timeout=28800
Server_Response_Timeout=60
No_Activity_Timeout=86400

[SYSTEM_INDEX]
LOCAL=Enabled

; Ip_Address is the compose SERVICE name of the IRIS container. Service names
; always resolve on the project network, so this needs no substitution as long
; as the service stays named `iris`.
[LOCAL]
IRIS_Machine_Name=iris
Ip_Address=iris
TCP_Port=1972
IRIS_Port=1972
System=*
System_Manager=*
Username=_SYSTEM
Password=SYS
Minimum_Server_Connections=3
; 6 is enough for a browser. VS Code, an MCP server and the edit hook together
; need more: 12 is the safe floor.
Maximum_Session_Connections=12

; /api is required by VS Code ObjectScript and by every IRIS MCP server.
[APP_PATH_INDEX]
/=Enabled
/csp=Enabled
/api=Enabled
/isc=Enabled

[APP_PATH:/]
Default_Server=LOCAL

[APP_PATH:/csp]
Default_Server=LOCAL

[APP_PATH:/api]
Default_Server=LOCAL

[APP_PATH:/isc]
Default_Server=LOCAL


